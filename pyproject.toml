[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hoot-probe"
version = "1.2.0"
description = "HOOT — a portable BACnet/IP temperature, humidity and CO2 probe for building automation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HOOT contributors" }]
keywords = ["bacnet", "building-automation", "hvac", "raspberry-pi", "sensor", "iaq"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "bacpypes3>=0.0.110,<0.1",
    "PyYAML>=6.0.3,<7",
    "psutil>=7.2",
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54,<1",
    "jinja2>=3.1.6,<4",
]

[project.optional-dependencies]
pi = [
    "adafruit-blinka>=9.2",
    "adafruit-circuitpython-busdevice>=5.2.17",
    "adafruit-circuitpython-sht4x>=1.0.27",
    "adafruit-circuitpython-scd4x>=1.4.13",
    "adafruit-circuitpython-ssd1306>=2.12.24",
    "Pillow>=13.0",
]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "httpx2>=2.16", "ruff>=0.17"]

[project.urls]
Homepage = "https://github.com/KSU-PlantOps/hoot"
Issues = "https://github.com/KSU-PlantOps/hoot/issues"

[project.scripts]
hoot = "hoot.__main__:main"

[tool.setuptools.packages.find]
include = ["hoot*"]

[tool.setuptools.package-data]
"hoot.web" = ["templates/*.html", "static/*"]

[tool.ruff]
target-version = "py311"   # Raspberry Pi OS Bookworm ships Python 3.11
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "B", "UP", "RUF"]
ignore = ["E501", "UP037", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF022",
          "RUF059", "RUF100", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
