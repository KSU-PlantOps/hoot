    <text x="410" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">Raspberry Pi 5 + PoE HAT, out of the airstream</text>
    <rect x="320" y="175" width="205" height="70" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
    <text x="334" y="201" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Sensor drivers</text>
