  <text x="300" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="6" fill="#1f2328">HOOT</text>
  <text x="304" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#59636e"><tspan font-weight="700" fill="#d99e00">H</tspan>umidity &amp; <tspan font-weight="700" fill="#d99e00">O</tspan>perational <tspan font-weight="700" fill="#d99e00">O</tspan>bservation <tspan font-weight="700" fill="#d99e00">T</tspan>erminal</text>
  <text x="304" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1f2328">A portable temperature, humidity &amp; CO₂ probe that any BAS discovers as a BACnet/IP device.</text>
