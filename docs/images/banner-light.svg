    <ellipse cx="110" cy="122" rx="88" ry="98" fill="#2d333b" stroke="#2d333b" stroke-width="3"/>
    <circle cx="74" cy="104" r="36" fill="#ffffff" stroke="#d99e00" stroke-width="8"/>
    <circle cx="146" cy="104" r="36" fill="#ffffff" stroke="#d99e00" stroke-width="8"/>
